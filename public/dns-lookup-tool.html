        body { background-color: #0B0C10; color: #E2E8F0; overflow-x: hidden; font-family: 'Outfit', sans-serif; }
        .bg-glow { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 150vw; height: 150vh; background: radial-gradient(circle at 50% 50%, rgba(122,0,255,0.15) 0%, rgba(69,243,255,0.05) 30%, transparent 70%); z-index: -1; animation: pulse-glow 15s infinite alternate ease-in-out; pointer-events: none; }

        .glass-panel { background: rgba(31,40,51,0.4); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 8px 32px 0 rgba(0,0,0,0.3); }

        .orb-1 { background: rgba(122,0,255,0.4); width: 400px; height: 400px; top: 10%; left: 10%; }
        .orb-2 { background: rgba(69,243,255,0.3); width: 300px; height: 300px; top: 40%; right: 10%; animation-delay: -5s; }
        @keyframes float-orb { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(30px,-50px) scale(1.1); } }
        .bg-grid { position: fixed; inset: 0; background-image: linear-gradient(to right,rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,0.03) 1px,transparent 1px); background-size: 40px 40px; z-index: -2; mask-image: radial-gradient(circle at center,black,transparent 80%); -webkit-mask-image: radial-gradient(circle at center,black,transparent 80%); }

        .github-glitter::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(to right,rgba(255,255,255,0) 0%,rgba(255,255,255,0.06) 50%,rgba(255,255,255,0) 100%); transform: rotate(45deg) translateX(-100%); animation: glitter 4s linear infinite; pointer-events: none; }
        @keyframes glitter { 0% { transform: rotate(45deg) translateX(-150%); } 100% { transform: rotate(45deg) translateX(150%); } }

        #toast { position: fixed; bottom: 2rem; right: 2rem; z-index: 9999; padding: 0.875rem 1.5rem; border-radius: 0.75rem; font-weight: 600; font-size: 0.9rem; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; pointer-events: none; display: flex; align-items: center; gap: 0.5rem; }
        #toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
        #toast.success { background: rgba(16,185,129,0.95); color: #fff; box-shadow: 0 0 20px rgba(16,185,129,0.3); }
        #toast.error { background: rgba(239,68,68,0.95); color: #fff; box-shadow: 0 0 20px rgba(239,68,68,0.3); }

        .record-type-btn { padding: 0.5rem 1rem; border-radius: 0.75rem; font-weight: 600; font-size: 0.875rem; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(15, 23, 42, 0.5); color: #94a3b8; transition: all 0.2s ease; cursor: pointer; }
        .record-type-btn:hover { border-color: rgba(69, 243, 255, 0.3); color: #fff; }
        .record-type-btn.active { background: rgba(69, 243, 255, 0.15); border-color: #45F3FF; color: #45F3FF; box-shadow: 0 0 15px rgba(69, 243, 255, 0.2); }
    </style>

<body class="antialiased min-h-screen relative selection:bg-brand-primary selection:text-dark-900">
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div id="toast"></div>

    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50 glass-panel border-b-0 border-t-0 rounded-none py-4 px-6 md:px-12 flex justify-between items-center transition-all duration-300" id="navbar">
        <a href="index.html" class="flex items-center gap-3 group">
            <div class="w-10 h-10 rounded-xl flex items-center justify-center transform group-hover:rotate-12 transition-transform shadow-[0_0_15px_rgba(69,243,255,0.4)] bg-dark-800/60 backdrop-blur-md border border-white/10">
                <img src="images/letter-d.png" alt="Infiniteforge Logo" class="w-8 h-8 object-contain">
            </div>
            <span class="text-2xl font-bold tracking-tight text-white group-hover:text-brand-primary transition-colors">Infinite<span class="font-light">forge</span></span>
        </a>
        <div class="hidden md:flex gap-8 items-center font-medium text-gray-300">
            <a href="index.html" class="hover:text-brand-primary transition-colors">Home</a>
            <a href="index.html#featured" class="hover:text-brand-primary transition-colors">Featured Tools</a>
            <a href="index.html#all-tools" class="hover:text-brand-primary transition-colors">All Tools</a>
        </div>
        <div>
            <a href="https://github.com/mahibala-h" target="_blank" class="glass-panel px-5 py-2.5 rounded-full text-sm font-semibold hover:bg-dark-800/60 backdrop-blur-md border border-white/10 github-glitter transition-colors flex items-center gap-2">
                <i data-feather="github" class="w-4 h-4"></i> GitHub
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto pt-28 pb-16 px-4">
        <!-- Header -->
        <div class="text-center mb-10">
            <h1 class="text-4xl sm:text-5xl font-extrabold mb-4 tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-200 to-brand-primary">
                DNS Lookup Tool
            </h1>
            <p class="text-lg text-gray-400 max-w-2xl mx-auto leading-relaxed">
                Query domain name server records in real-time across Google DNS resolver. Lookup A, AAAA, MX, CNAME, TXT, NS, SOA, and PTR records.
            </p>
        </div>

        <!-- Query Form Card -->
        <div class="glass-panel rounded-2xl p-8 mb-8">
            <form id="dns-form" class="space-y-6">
                <!-- Domain Input -->
                <div>
                    <label for="domain" class="block mb-2 text-xs font-semibold tracking-wider text-gray-400">DOMAIN NAME OR HOSTNAME</label>
                    <div class="relative">
                        <input type="text" id="domain" placeholder="example.com or google.com" class="w-full pl-11" required="" autocomplete="off">
                        <i data-feather="globe" class="w-5 h-5 text-gray-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                    </div>
                </div>

                <!-- Record Types Selection -->
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <label class="text-xs font-semibold tracking-wider text-gray-400">DNS RECORD TYPES</label>
                        <button type="button" id="select-all-types" class="text-xs text-brand-primary hover:underline">Select All</button>
                    </div>
                    <div class="flex flex-wrap gap-2.5" id="record-types-container">
                        <button type="button" class="record-type-btn active" data-type="A">A (IPv4)</button>
                        <button type="button" class="record-type-btn" data-type="AAAA">AAAA (IPv6)</button>
                        <button type="button" class="record-type-btn active" data-type="MX">MX (Mail)</button>
                        <button type="button" class="record-type-btn" data-type="CNAME">CNAME</button>
                        <button type="button" class="record-type-btn active" data-type="TXT">TXT (SPF/DKIM)</button>
                        <button type="button" class="record-type-btn" data-type="NS">NS (Name Server)</button>
                        <button type="button" class="record-type-btn" data-type="SOA">SOA</button>
                        <button type="button" class="record-type-btn" data-type="PTR">PTR</button>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex flex-wrap items-center gap-4 pt-2">
                    <button type="submit" id="lookup-btn" class="glass-panel px-8 py-3.5 rounded-xl font-bold text-brand-primary hover:bg-brand-primary/10 border border-brand-primary/40 shadow-[0_0_20px_rgba(69,243,255,0.2)] transition-all flex items-center gap-2">
                        <i data-feather="search" class="w-5 h-5"></i>
                        <span id="lookup-btn-text">Lookup DNS Records</span>
                    </button>
                    <button type="button" id="clear-btn" class="glass-panel px-5 py-3.5 rounded-xl font-medium text-gray-400 hover:text-white border border-white/10 hover:bg-white/5 transition-all">
                        Clear
                    </button>
                </div>
            </form>
        </div>

        <!-- Results Section -->
        <div id="results-section" class="space-y-6 hidden">
            <div class="flex items-center justify-between">
                <h3 class="text-xl font-bold text-white flex items-center gap-2">
                    <i data-feather="server" class="w-5 h-5 text-brand-primary"></i>
                    Query Results for <span id="results-domain-name" class="text-brand-primary font-mono"></span>
                </h3>
                <button id="export-btn" class="glass-panel px-4 py-2 rounded-lg text-xs font-semibold text-gray-300 hover:text-brand-primary border border-white/10 flex items-center gap-1.5 transition-all">
                    <i data-feather="download" class="w-3.5 h-3.5"></i> Export Text
                </button>
            </div>

            <div id="results-content" class="space-y-4">
                <!-- Dynamically filled with record cards -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-white/5 py-12 px-6 mt-20 relative z-10 bg-dark-900/80 backdrop-blur-md">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center bg-dark-800/60 backdrop-blur-md border border-white/10">
                    <img src="images/letter-d.png" alt="Infiniteforge Logo" class="w-6 h-6 object-contain">
                </div>
                <span class="text-xl font-bold tracking-tight text-white">Infinite<span class="font-light">forge</span></span>
            </div>
            <div class="text-gray-500 text-sm">© 2026 Infiniteforge. Built for creators worldwide.</div>
        </div>
    </footer>
