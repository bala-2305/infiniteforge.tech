    <style>
        body { background-color: #0B0C10; color: #E2E8F0; overflow-x: hidden; font-family: 'Outfit', sans-serif; }
        .bg-glow { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 150vw; height: 150vh; background: radial-gradient(circle at 50% 50%, rgba(122,0,255,0.15) 0%, rgba(69,243,255,0.05) 30%, transparent 70%); z-index: -1; animation: pulse-glow 15s infinite alternate ease-in-out; pointer-events: none; }
        @keyframes pulse-glow { 0% { transform: translate(-50%,-50%) scale(1); opacity:0.8; } 100% { transform: translate(-50%,-50%) scale(1.1); opacity:1; } }
        .glass-panel { background: rgba(31,40,51,0.4); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 8px 32px 0 rgba(0,0,0,0.3); }
        .glow-orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5; z-index: -1; animation: float-orb 10s ease-in-out infinite alternate; }
        .orb-1 { background: rgba(122,0,255,0.4); width: 400px; height: 400px; top: 10%; left: 10%; }
        .orb-2 { background: rgba(69,243,255,0.3); width: 300px; height: 300px; top: 40%; right: 10%; animation-delay: -5s; }
        @keyframes float-orb { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(30px,-50px) scale(1.1); } }
        .bg-grid { position: fixed; inset: 0; background-image: linear-gradient(to right,rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,0.03) 1px,transparent 1px); background-size: 40px 40px; z-index: -2; mask-image: radial-gradient(circle at center,black,transparent 80%); -webkit-mask-image: radial-gradient(circle at center,black,transparent 80%); }

        input[type="text"], input[type="password"], textarea, select { background-color: rgba(15,23,42,0.6) !important; color: #fff !important; border: 1px solid rgba(255,255,255,0.08) !important; border-radius: 0.75rem; padding: 0.55rem 0.85rem; font-size: 0.875rem; }
        input[type="text"]:focus, input[type="password"]:focus, textarea:focus, select:focus { border-color: rgba(69,243,255,0.4) !important; box-shadow: 0 0 15px rgba(69,243,255,0.15) !important; outline: none !important; }

        .tab-btn.active { background: rgba(69,243,255,0.15); border-color: rgba(69,243,255,0.5); color: #45F3FF; }

        .github-glitter { position: relative; overflow: hidden; }

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto pt-28 pb-16 px-4 sm:px-6">
        <!-- Header -->
        <div class="text-center mb-10">
            <h1 class="text-4xl sm:text-5xl font-extrabold mb-4 tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-200 to-brand-primary">
                Custom QR Code Generator
            </h1>
            <p class="text-lg text-gray-400 max-w-2xl mx-auto leading-relaxed">
                Create high-resolution QR codes for websites, Wi-Fi credentials, text, and emails with custom colors.
            </p>
        </div>

        <div class="grid lg:grid-cols-12 gap-6">
            <!-- Left 6 cols: Data & Style Config -->
            <div class="lg:col-span-6 glass-panel p-6 sm:p-8 rounded-3xl border border-white/10 space-y-6">
                <!-- Type Tabs -->
                <div class="grid grid-cols-3 gap-2">
                    <button class="tab-btn active glass-panel py-2 rounded-xl text-xs font-bold border border-white/5" data-type="url">Website URL</button>
                    <button class="tab-btn glass-panel py-2 rounded-xl text-xs font-bold border border-white/5 text-gray-400" data-type="wifi">Wi-Fi</button>
                    <button class="tab-btn glass-panel py-2 rounded-xl text-xs font-bold border border-white/5 text-gray-400" data-type="text">Plain Text</button>
                </div>

                <!-- URL Panel -->
                <div id="panel-url" class="space-y-2">
                    <label class="block text-xs font-semibold text-gray-400 uppercase">Website URL</label>
                    <input type="text" id="qr-url-val" value="https://infiniteforge.tech" class="w-full font-mono">
                </div>

                <!-- WiFi Panel -->
                <div id="panel-wifi" class="space-y-3 hidden">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Network Name (SSID)</label>
                        <input type="text" id="wifi-ssid" placeholder="MyWiFiNetwork" class="w-full">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Password</label>
                        <input type="text" id="wifi-pass" placeholder="SecretPassword" class="w-full font-mono">
                    </div>
                </div>

                <!-- Text Panel -->
                <div id="panel-text" class="space-y-2 hidden">
                    <label class="block text-xs font-semibold text-gray-400 uppercase">Custom Message</label>
                    <textarea id="qr-text-val" rows="3" class="w-full" placeholder="Enter any text..."></textarea>
                </div>

                <!-- Color & Size Options -->
                <div class="grid grid-cols-2 gap-3 pt-4 border-t border-white/10">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">QR Color</label>
                        <input type="color" id="qr-color-dark" value="#000000" class="w-full h-10 rounded-xl bg-transparent border border-white/10 cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Background Color</label>
                        <input type="color" id="qr-color-light" value="#ffffff" class="w-full h-10 rounded-xl bg-transparent border border-white/10 cursor-pointer">
                    </div>
                </div>

                <button id="gen-qr-btn" class="glass-panel w-full py-3.5 rounded-xl font-bold text-dark-900 bg-brand-primary hover:bg-brand-primary/90 shadow-[0_0_20px_rgba(69,243,255,0.3)] flex items-center justify-center gap-2 transition-all">
                    <i data-feather="refresh-cw" class="w-4 h-4"></i> Generate QR Code
                </button>
            </div>

            <!-- Right 6 cols: Live Rendered QR & Download -->
            <div class="lg:col-span-6 glass-panel p-6 sm:p-8 rounded-3xl border border-white/10 flex flex-col items-center justify-center space-y-6">
                <!-- QR Code Box Container -->
                <div class="p-6 rounded-3xl bg-white shadow-2xl border-4 border-brand-primary/20 flex items-center justify-center" id="qrcode-wrapper">
                    <div id="qrcode-box"></div>
                </div>

                <div class="w-full flex gap-3">
                    <button id="download-qr-btn" class="glass-panel w-full py-3 rounded-xl font-bold text-brand-primary border border-brand-primary/40 flex items-center justify-center gap-2 transition-all">

                    </button>
                </div>
            </div>
        </div>
