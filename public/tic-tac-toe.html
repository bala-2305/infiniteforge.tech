    <style>
        body { background-color: #0B0C10; color: #E2E8F0; overflow-x: hidden; font-family: 'Outfit', sans-serif; }
        .bg-glow { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 150vw; height: 150vh; background: radial-gradient(circle at 50% 50%, rgba(122,0,255,0.15) 0%, rgba(69,243,255,0.05) 30%, transparent 70%); z-index: -1; animation: pulse-glow 15s infinite alternate ease-in-out; pointer-events: none; }
        @keyframes pulse-glow { 0% { transform: translate(-50%,-50%) scale(1); opacity:0.8; } 100% { transform: translate(-50%,-50%) scale(1.1); opacity:1; } }
        .glass-panel { background: rgba(31,40,51,0.4); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 8px 32px 0 rgba(0,0,0,0.3); }
        .glow-orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5; z-index: -1; animation: float-orb 10s ease-in-out infinite alternate; }
        .orb-1 { background: rgba(122,0,255,0.4); width: 400px; height: 400px; top: 10%; left: 10%; }
        .orb-2 { background: rgba(69,243,255,0.3); width: 300px; height: 300px; top: 40%; right: 10%; animation-delay: -5s; }
        @keyframes float-orb { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(30px,-50px) scale(1.1); } }
        .bg-grid { position: fixed; inset: 0; background-image: linear-gradient(to right,rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,0.03) 1px,transparent 1px); background-size: 40px 40px; z-index: -2; mask-image: radial-gradient(circle at center,black,transparent 80%); -webkit-mask-image: radial-gradient(circle at center,black,transparent 80%); }

        .github-glitter { position: relative; overflow: hidden; }
        .github-glitter::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(to right,rgba(255,255,255,0) 0%,rgba(255,255,255,0.06) 50%,rgba(255,255,255,0) 100%); transform: rotate(45deg) translateX(-100%); animation: glitter 4s linear infinite; pointer-events: none; }
        @keyframes glitter { 0% { transform: rotate(45deg) translateX(-150%); } 100% { transform: rotate(45deg) translateX(150%); } }

        #toast { position: fixed; bottom: 2rem; right: 2rem; z-index: 9999; padding: 0.875rem 1.5rem; border-radius: 0.75rem; font-weight: 600; font-size: 0.9rem; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; pointer-events: none; display: flex; align-items: center; gap: 0.5rem; }
        #toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
        #toast.success { background: rgba(16,185,129,0.95); color: #fff; box-shadow: 0 0 20px rgba(16,185,129,0.3); }
        #toast.error { background: rgba(239,68,68,0.95); color: #fff; box-shadow: 0 0 20px rgba(239,68,68,0.3); }

        .ttt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; background: rgba(15, 23, 42, 0.8); border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 18px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); max-width: 360px; margin: 0 auto; }
        .ttt-cell { aspect-ratio: 1/1; border-radius: 18px; background: rgba(31, 40, 51, 0.5); border: 2px solid rgba(255, 255, 255, 0.06); display: flex; align-items: center; justify-content: center; font-family: 'Outfit', sans-serif; font-size: 3rem; font-weight: 900; cursor: pointer; transition: all 0.2s ease; }
        .ttt-cell:hover:empty { background: rgba(255, 255, 255, 0.05); border-color: rgba(69, 243, 255, 0.3); }
        .ttt-cell.x { color: #45F3FF; text-shadow: 0 0 20px rgba(69, 243, 255, 0.6); }
        .ttt-cell.o { color: #FF2A7A; text-shadow: 0 0 20px rgba(255, 42, 122, 0.6); }
        .ttt-cell.winner { background: rgba(69, 243, 255, 0.2); border-color: #45F3FF; animation: win-glow 1s infinite alternate; }
        @keyframes win-glow { 0% { transform: scale(0.96); } 100% { transform: scale(1.04); } }
    </style>
</head>

<body class="antialiased min-h-screen relative selection:bg-brand-primary selection:text-dark-900">
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div id="toast"></div>

    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50 glass-panel border-b-0 border-t-0 rounded-none py-4 px-6 md:px-12 flex justify-between items-center transition-all duration-300" id="navbar">
        <a href="index.html" class="flex items-center gap-3 group">
            <div class="w-10 h-10 rounded-xl flex items-center justify-center transform group-hover:rotate-12 transition-transform shadow-[0_0_15px_rgba(69,243,255,0.4)] bg-dark-800/60 backdrop-blur-md border border-white/10">
                <img src="images/letter-d.png" alt="Infiniteforge Logo" class="w-8 h-8 object-contain">
            </div>
            <span class="text-2xl font-bold tracking-tight text-white group-hover:text-brand-primary transition-colors">Infinite<span class="font-light">forge</span></span>

        <div class="hidden md:flex gap-8 items-center font-medium text-gray-300">

        <div>

    <!-- Main Content -->
    <main class="max-w-xl mx-auto pt-28 pb-16 px-4 sm:px-6">
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-4xl sm:text-5xl font-extrabold mb-2 tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-200 to-brand-primary">
                Tic Tac Toe
            </h1>
            <p class="text-xs text-gray-400">Play against our Minimax AI or with a friend locally.</p>
        </div>

        <!-- Scoreboard -->
        <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="glass-panel p-3.5 rounded-2xl border border-white/5 text-center">
                <div class="text-[11px] text-gray-400 font-semibold uppercase">Player (X)</div>
                <div class="text-2xl font-bold font-mono text-brand-primary" id="score-x">0</div>
            </div>
            <div class="glass-panel p-3.5 rounded-2xl border border-white/5 text-center">
                <div class="text-[11px] text-gray-400 font-semibold uppercase">Draws</div>
                <div class="text-2xl font-bold font-mono text-gray-400" id="score-draws">0</div>
            </div>
            <div class="glass-panel p-3.5 rounded-2xl border border-white/5 text-center">
                <div class="text-[11px] text-gray-400 font-semibold uppercase" id="o-label">AI Bot (O)</div>
                <div class="text-2xl font-bold font-mono text-pink-400" id="score-o">0</div>
            </div>
        </div>

        <!-- Mode and Controls -->
        <div class="glass-panel p-3.5 rounded-2xl border border-white/10 mb-6 flex items-center justify-between gap-4">

            <div class="flex items-center gap-2">
                <select id="game-mode" class="bg-dark-900/80 text-white text-xs border border-white/10 rounded-xl px-3 py-1.5 outline-none font-semibold">
                    <option value="ai">vs Smart AI</option>
                    <option value="pvp">2 Players</option>
                </select>
                <button id="restart-game-btn" class="glass-panel px-3.5 py-1.5 rounded-xl text-xs font-bold text-white hover:bg-white/10 border border-white/10 flex items-center gap-1.5 transition-all">
                    <i data-feather="rotate-ccw" class="w-3.5 h-3.5"></i> Restart
                </button>
            </div>
        </div>

        <!-- 3x3 Grid Board -->
